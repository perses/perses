<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png/ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Perses" />
    <title>Observe</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 0;
      }

      .loading {
        display: flex;
        height: 100vh;
        width: 100vw;
        align-items: center;
        justify-content: center;
        padding: 0;
        background-color: light-dark(#ffffff, #151721);
      }

      .dark-theme {
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="loader" class="loading">
        <img id="loader-logo" alt="logo" style="width:10%;display:none" />
      </div>
      <script>
        const isDarkTheme = localStorage.getItem('perses-dark-theme-enabled') === 'true';
        if (isDarkTheme) {
          document.getElementById('loader').classList.add('dark-theme');
        }
        fetch('/api/v1/branding')
          .then(function(r) { return r.json(); })
          .then(function(b) {
            if (b && b.logo) {
              var img = document.getElementById('loader-logo');
              img.src = b.logo;
              img.style.display = '';
            }
          })
          .catch(function() {});
      </script>
    </div>
  </body>
</html>
