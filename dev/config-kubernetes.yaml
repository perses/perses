security:
  readonly: false
  encryption_key: "=tW$56zytgB&3jN2E%7-+qrGZE?v6LCc"
  enable_auth: true
  authorization:
    provider:
      kubernetes:
        enable: true
        kubeconfig: "dev/kubernetes/local/perses-backend"
  authentication:
    providers:
      kubernetes:
        enable: true

database:
  file:
    folder: "dev/local_db"
    extension: "json"
    case_sensitive: false

provisioning:
  folders:
    - "dev/data"

ephemeral_dashboard:
  enable: true
  cleanup_interval: 1h

frontend:
  explorer:
    enable: true

  important_dashboards:
    - title: "Perses demos"
      dashboards:
        - project: "testing"
    - title: "Quick links"
      description: "Highlighted dashboards"
      dashboards:
        - project: "perses"
          dashboard: "NodeExporter"
        - project: "perses"
          dashboard: "ThreeSignals"

  information: |-
    # Hello World
    ## File Database setup

plugin:
  enable_dev: true
  path: "plugins"
  archive_path: "plugins-archive"

datasource:
  proxy:
    # The datasources of the dev environment (Prometheus, Tempo, Loki, Pyroscope, ...) are running on localhost.
    # The loopback interface is denied by default, so it must be explicitly allowed.
    allowed_networks:
      - "127.0.0.0/8"
      - "::1/128"
