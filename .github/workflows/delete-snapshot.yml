name: Branch Deleted
on: delete
jobs:
  remove-snapshot-tag:
    if: ${{ github.event.ref_type == 'branch'  && startsWith(github.event.ref, 'snapshot/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - name: Configure npm registry authentication
        # pnpm only expands environment variables in user-level registry credentials,
        # so the token placeholder must be written in ~/.npmrc (not in the repository .npmrc).
        run: echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - name: Remove npm snapshot tag
        run: ./scripts/ui_release.sh --remove-snapshot "${{ github.event.ref }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
