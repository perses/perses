name: react
on:
  push:
    branches:
      - main
      - release/*
      - snapshot/*
    tags:
      - v*
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - name: install deps
        run: cd ./ui && pnpm install --frozen-lockfile
      - run: cd ./ui && pnpm run lint
      - run: cd ./ui && pnpm run format:check
  type_check:
    name: "type check"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - name: install deps
        run: cd ./ui && pnpm install --frozen-lockfile
      - run: cd ./ui && pnpm run type-check
  test:
    name: "unit test"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - name: install deps
        run: cd ./ui && pnpm install --frozen-lockfile
      - run: cd ./ui && pnpm run test
  examples:
    name: "example (${{ matrix.example }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - embedded-react18
          - embedded-react19
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - name: install, type-check and build the example
        run: cd ./examples && ./test.sh ${{ matrix.example }}
