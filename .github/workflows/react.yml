name: react
on:
  push:
    branches:
      - main
      - release/*
      - snapshot/*
    tags:
      - v*
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ui/.nvmrc"
      - name: install deps
        run: cd ./ui && pnpm install --frozen-lockfile
      - run: cd ./ui && pnpm lint
      - run: cd ./ui && pnpm format:check
  type_check:
    name: "type check"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ui/.nvmrc"
      - name: install deps
        run: cd ./ui && pnpm install --frozen-lockfile
      - run: cd ./ui && pnpm type-check
  test:
    name: "unit test"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ui
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ui/.nvmrc"
      - name: install deps
        run: cd ./ui && pnpm install --frozen-lockfile
      - run: cd ./ui && pnpm test
