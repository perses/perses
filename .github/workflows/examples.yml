name: examples
# The examples install the published Perses packages without a lockfile, so they don't depend on the code of a pull
# request. Only run them when they change, and on a schedule to detect breaking upstream releases.
on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  examples:
    name: "example (${{ matrix.example }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - embedded-react18
          - embedded-react19
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ui/.nvmrc"
      - name: install, type-check and build the example
        run: cd ./examples && ./test.sh ${{ matrix.example }}
