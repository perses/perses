name: ci
on:
  push:
    branches:
      - main
      - release/*
      - snapshot/*
    tags:
      - v*
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  build-frontend:
    name: "build-frontend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ui/.nvmrc"

      - name: Check Tag
        ## This step is verifying that the tag follow the semver
        ## It is only triggered when a tag is created
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'v') }}
        run: ./scripts/release.sh --check-version "${{ github.ref_name }}"

      - name: Check libraries version
        ## This step is verifying that the version of each package is matching the tag
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'v') }}
        run: ./scripts/ui_release.sh --check-package "${{ github.ref_name }}"

      - name: Use snapshot version
        ## This step only runs for "snapshot" branches starting with "snapshot/"
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'snapshot/') }}
        run: ./scripts/ui_release.sh --snapshot-version "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Install UI deps
        working-directory: ./ui
        run: npm ci
      - name: Build the app and all packages
        working-directory: ./ui
        run: npm run build

      - name: Generate frontend SBOM (CycloneDX)
        working-directory: ./ui
        run: npx @cyclonedx/cyclonedx-npm --output-file ../ui-sbom.cdx.json --output-format JSON
      - name: store frontend SBOM
        if: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'snapshot/')) }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-sbom
          path: ui-sbom.cdx.json

      - name: store react production build
        uses: actions/upload-artifact@v7
        with:
          name: ui-libs
          path: |
            ui/**/dist
            !ui/node_modules

  build:
    name: "go and github release"
    needs: "build-frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # This env is required for the docker manifest command to work
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: perses/github-actions@v0.13.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_go: true
      - name: Download react build
        uses: actions/download-artifact@v8
        with:
          name: ui-libs
          path: ui
      - name: Download frontend SBOM
        if: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'snapshot/')) }}
        uses: actions/download-artifact@v8
        with:
          name: ui-sbom
          path: .
      - name: Generate endpoints
        run: make generate
      - name: Install go deps
        run: go mod download
      - name: Extract Changelog
        run: make extract-changelog
      - # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'v') || github.ref_name == 'main') }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: "docker.io"
      - name: Login to Quay.io
        uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'v') || github.ref_name == 'main') }}
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
          registry: "quay.io"
      - name: Override version
        if: ${{ github.ref_name == 'main' }}
        run: ./scripts/override_version.sh
      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@v0
      - name: install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          install-only: true
      - name: Build Go binaries and docker images
        run: make cross-build
      - name: Publish main docker image
        if: ${{ github.ref_name == 'main' }}
        run: make push-main-docker-image
      - name: Publish Release and binaries
        ## This step will only run when a new tag is pushed.
        ## It will build the Go binaries and the docker images and then publish:
        ## - the GitHub release with the archive built
        ## - docker images on the different docker registry selected
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'v') }}
        run: make cross-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-tap:
    name: "update homebrew tap"
    needs: "build"
    ## Open a pull request on https://github.com/perses/homebrew-tap to update the formulae.
    ## Only stable releases are published to the tap, pre-releases (alpha, beta, rc) are skipped.
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      TAP_BRANCH: perses-bot/release-${{ github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_go: true
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: perses/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.BOT_TOKEN }}
      - name: Update formulae
        run: make update-homebrew-tap VERSION="${TAG}" HOMEBREW_TAP_DIR=./homebrew-tap
      - name: Commit changes
        id: commit
        ## The commit is only pushed once the formulae have been installed and tested.
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          repository: homebrew-tap
          branch: ${{ env.TAP_BRANCH }}
          create_branch: true
          skip_fetch: true
          skip_push: true
          commit_message: "Release ${{ env.TAG }}"
          commit_options: "--signoff"
          commit_user_name: "perses-bot"
          commit_user_email: "perses-team+bot@googlegroups.com"
          commit_author: "perses-bot <perses-team+bot@googlegroups.com>"
      - name: Install and test formulae
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap perses/tap "${GITHUB_WORKSPACE}/homebrew-tap"
          brew trust --tap perses/tap
          brew install perses/tap/perses perses/tap/percli
          brew test perses/tap/perses perses/tap/percli
      - name: Open pull request
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        ## An open pull request is left untouched, so that re-running the job doesn't discard the commits added to it.
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          open_pull_requests="$(gh pr list --repo perses/homebrew-tap --head "${TAP_BRANCH}" --state open --json number --jq 'length')"
          if [[ "${open_pull_requests}" != "0" ]]; then
            echo "A pull request is already open for ${TAP_BRANCH}, leaving it untouched"
            exit 0
          fi
          git push --force origin "${TAP_BRANCH}"
          version="${TAG#v}"
          gh pr create --repo perses/homebrew-tap --base main --head "${TAP_BRANCH}" --title "Release ${TAG}" --body-file - <<EOF
          Update the \`perses\` and \`percli\` formulae to [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}).

          - \`version\` set to \`${version}\`.
          - \`sha256\` of the archives taken from \`perses_${version}_checksums.txt\`.

          Both formulae have been installed and tested with \`brew install\` and \`brew test\` on Linux amd64.

          This pull request has been opened by the [release workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF
