# Until bug below is sorted we will not allow dependabot to run by itself for npm dependencies
# https://github.com/dependabot/dependabot-core/issues/1190
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "**/*"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
    ignore:
      # Ignore updates for cuelang.org/go because there is a regression between v0.16 and v0.17 which is breaking the migration.
      # Until this is fixed, we cannot upgrade cuelang.org/go to v0.17 and we will ignore updates for this dependency.
      # See https://github.com/perses/perses/issues/4272 for more context
      - dependency-name: "cuelang.org/go"
    # Raise all gomod pull requests with custom labels
    labels:
      - "dependencies"
      - "api"
  - package-ecosystem: "npm"
    directory: "/ui"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    # Raise all npm pull requests with custom labels
    labels:
      - "dependencies"
      - "ui"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
